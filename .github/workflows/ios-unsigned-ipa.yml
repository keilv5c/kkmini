# ============================================================================
#  Build iOS IPA (unsigned) —— 用 GitHub 的 macOS 机器编译出未签名 IPA
# ----------------------------------------------------------------------------
#  用途：你没有 Mac 时拿到 .ipa，再在 Windows 上用 Sideloadly 或自己的证书签名安装。
#
#  用法：推到 GitHub → Actions → 本工作流 → Run workflow
#        （可选填 bundle_id：免费 Apple ID 必须用全局唯一的 Bundle ID）
#
#  ── 这份是"分步 + 会自检"的版本，专治"某一步 2 秒就红"这类问题 ──
#   1. 开头就打印 commit SHA 和 ios/ 目录清单 —— 一眼看出推上去的东西全不全
#   2. 自检 Podfile / Xcode 工程 / 共享 scheme / web/index.html / capacitor.config.ts
#   3. cap sync 拆成 cap copy（只拷资源）+ 独立 pod install，
#      这样 CocoaPods 的问题会出现在它自己的步骤里、带完整日志
#   4. pod install 失败会自动 pod repo update 重试一次
#   5. 任何一步失败都会打印诊断（版本、目录树、Podfile）
# ============================================================================
name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID（留空用工程里的 com.mdz.webrtcmp；免费 Apple ID 请填一个你独有的，如 com.yourname.mdzmp）'
        required: false
        default: ''
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------- 自检：先确认"推全了"
      - name: 自检：这次构建的是哪个提交、仓库里有什么
        run: |
          echo "================ 本次构建的提交 ================"
          git log -1 --oneline
          git rev-parse HEAD
          echo ""
          echo "================ ios/ 目录 ================"
          ls -la ios || { echo "::error::ios/ 目录不存在 —— 推上来的内容不完整"; exit 1; }
          ls -la ios/App || true
          echo ""
          echo "================ 关键文件自检 ================"
          missing=0
          for f in ios/App/Podfile \
                   ios/App/App.xcodeproj/project.pbxproj \
                   ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme \
                   ios/App/App/Info.plist \
                   web/index.html \
                   web/mdz_p2p.js \
                   capacitor.config.ts \
                   package-lock.json ; do
            if [ -f "$f" ]; then echo "  OK   $f"; else echo "  ::error::缺失 $f"; missing=1; fi
          done
          if [ "$missing" != "0" ]; then
            echo "::error::仓库内容不完整。请确认是用 git push 推的（不是网页上传），且已 push 到最新提交。"
            exit 1
          fi
          echo "  web/ 文件数 : $(find web -type f | wc -l)"
          echo "  ios/ 文件数 : $(find ios -type f | wc -l)"
          echo ""
          echo "================ iOS 部署目标（必须 >= 15.5，MLKit 要求）================"
          echo "--- Podfile ---"
          grep -n "platform :ios" ios/App/Podfile || echo "::error::Podfile 里没有 platform :ios"
          echo "--- project.pbxproj ---"
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj | head -n 6
          if grep -q "platform :ios, '15.0'" ios/App/Podfile; then
            echo "::error::Podfile 还是 15.0 —— GoogleMLKit 8.x 要求 iOS 15.5，pod install 会秒失败"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Toolchain versions
        run: |
          node -v
          npm -v
          xcodebuild -version
          swift --version || true
          (pod --version || echo "CocoaPods 未安装")

      - name: Ensure CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            echo "安装 CocoaPods..."
            sudo gem install cocoapods --no-document
          fi
          pod --version

      - name: Install npm deps（跳过原生测试依赖，单独装 typescript）
        run: |
          npm ci --omit=dev
          npm install --no-save typescript
          echo "typescript    : $(test -d node_modules/typescript && echo OK || echo 缺失)"
          echo "@capacitor/ios: $(test -d node_modules/@capacitor/ios && echo OK || echo 缺失)"

      - name: 应用自定义 Bundle ID（可选）
        if: ${{ github.event.inputs.bundle_id != '' }}
        run: |
          NEW_ID="${{ github.event.inputs.bundle_id }}"
          echo "把 Bundle ID 改成: $NEW_ID"
          /usr/bin/sed -i '' "s/com\.mdz\.webrtcmp/$NEW_ID/g" ios/App/App.xcodeproj/project.pbxproj
          /usr/bin/sed -i '' "s/com\.mdz\.webrtcmp/$NEW_ID/g" capacitor.config.ts
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj
          grep -n "appId" capacitor.config.ts

      # ------------------------------------------- 只拷 web 资源（不碰 CocoaPods）
      - name: 拷贝 web 资源到 iOS 工程（cap copy）
        run: |
          set -o pipefail
          npx cap copy ios || {
            echo "::group::cap copy 失败诊断"
            echo "--- capacitor.config.ts ---"; cat capacitor.config.ts
            echo "--- ios/ 树 ---"; find ios -maxdepth 3 | head -n 40
            echo "--- node_modules/@capacitor ---"; ls node_modules/@capacitor
            echo "::endgroup::"
            exit 1
          }
          echo "--- 确认资源已拷入 ---"
          ls ios/App/App/public | head -n 12
          test -f ios/App/App/public/mdz_ui.js || { echo "::error::web 资源没拷进去"; exit 1; }

      # ------------------------- 原生依赖更新（重写 Podfile 里的 pods 块并跑 pod install）
      # 单独成步：这步不能省（新增插件的 pod 靠它写进 Podfile），
      # 拆开后 CocoaPods 的报错就只会出现在这一步，日志清清楚楚。
      #
      # ⚠️ 血的教训（本工作流连红三次、每次都"2 秒红 + 零下载日志"的原因）：
      #    CLI 用正则 /(触发字符)[\s\S]+?(\nend)/ 定位要重写的块，
      #    当时 Podfile 的注释里恰好写了那串触发字符，匹配起点就前移了，
      #    把 platform / use_frameworks! / install! / 真正的定义行一起吃掉 ——
      #    pod install 在 1 秒内报 undefined method `capacitor_pods'，连一个 pod 都没开始下。
      #    修法：platform :ios,'15.5' 放 Podfile 第一行 + 注释里不写那串字符。
      #    下面那步校验是必须的，别再删掉它。
      - name: 更新 iOS 原生依赖（cap update）
        run: |
          set -o pipefail
          # cap update 内部会真跑一次 pod install（拉 CocoaPods CDN 规格 + 下载 MLKit 二进制），
          # 偶发超时会把整个作业误杀，所以失败时先 pod repo update 再自动重试一次。
          if ! npx cap update ios; then
            echo "::warning::cap update 第一次失败（常见原因：CocoaPods 拉 CDN 规格超时），pod repo update 后重试一次"
            pod repo update || true
            npx cap update ios || {
              echo "::group::cap update 失败诊断"
              echo "--- Podfile ---"; cat ios/App/Podfile
              echo "--- pod 版本 ---"; pod --version || true
              echo "--- 可用 Xcode ---"; xcodebuild -version || true
              echo "--- ios/App 目录 ---"; ls -la ios/App || true
              echo "::endgroup::"
              exit 1
            }
          fi

      # 必须紧跟在上一步后面：cap update 会按正则重写 Podfile，
      # 一旦被改坏，pod install 只会给一个"undefined method"的谜语报错。
      - name: 校验 Podfile 没被 cap update 改坏
        run: |
          node tools/check-podfile.js || {
            echo "::error::Podfile 被 Capacitor CLI 的正则改坏了（platform / use_frameworks! / 定义块被吃掉）"
            echo "::error::修法：platform :ios,'15.5' 必须留在 Podfile 第一行，注释里不要出现那串触发字符"
            echo "--- Podfile 现状 ---"
            cat ios/App/Podfile
            exit 1
          }

      # ------------------------------------------------------- pod install 独立成步
      - name: pod install（失败会自动 repo update 重试）
        working-directory: ios/App
        run: |
          set -o pipefail
          echo "--- Podfile ---"; cat Podfile
          echo "--- 开始 pod install ---"
          if ! pod install 2>&1 | tail -n 120; then
            echo "::warning::第一次 pod install 失败，执行 pod repo update 后重试"
            pod repo update || true
            pod install
          fi
          echo "--- 结果 ---"
          ls -la
          test -f Podfile.lock && echo "Podfile.lock 已生成 ✅"

      - name: 列出 scheme/配置（便于日志定位）
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -list || {
            echo "::error::工作区/scheme 有问题"; ls -la; exit 1;
          }

      - name: Archive（未签名）
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            archive | tail -n 80

      - name: 打包成 .ipa 并校验内容
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH" || { echo "::error::没找到 App.app，归档失败"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Minidayz-unsigned.ipa Payload
          ls -lh Minidayz-unsigned.ipa
          echo "--- 确认 web 代码进包了 ---"
          unzip -l Minidayz-unsigned.ipa | grep -E 'mdz_(p2p|ui|core)\.js|lan_bridge\.js|vendor/' || true
          echo "--- 确认 Info.plist 权限键 ---"
          PLIST="$APP_PATH/Info.plist"
          for k in NSCameraUsageDescription NSLocalNetworkUsageDescription NSBonjourServices UIRequiresFullScreen; do
            if /usr/libexec/PlistBuddy -c "Print :$k" "$PLIST" >/dev/null 2>&1; then
              echo "  OK   $k"
            else
              echo "  ::warning::缺少 $k"
            fi
          done
          echo "--- 包内 Bundle ID ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: minidayz-unsigned-ipa
          path: ${{ runner.temp }}/Minidayz-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
